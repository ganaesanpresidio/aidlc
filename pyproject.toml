[project]
name = "aidlc-e2e"
version = "0.1.0"
description = "Helper tools for the AI-DLC expense management playbook"
readme = "README.md"
authors = [
    { name = "ganaesan", email = "ganaesan86@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
aidlc-e2e = "aidlc_e2e:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/ is reserved for the platform units (see docs/00-overview.md)
module-root = "tools"
